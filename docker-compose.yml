services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI backend with YOLO detection
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/security_monitoring
      CORS_ORIGINS: "http://localhost:3000"
      MODEL_PATH: yolov8n.pt
      CONFIDENCE_THRESHOLD: "0.40"
      DEVICE: auto
      SOURCE_MODE: webcam
      CAMERA_INDEX: "0"
      RETENTION_DAYS: "7"
    volumes:
      - screenshots:/app/screenshots
      - yolo_models:/root/.cache
    ports:
      - "8000:8000"
    # Uncomment below to pass through a USB webcam
    # devices:
    #   - /dev/video0:/dev/video0

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Backend API URL accessible from server-side rendering
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  screenshots:
  yolo_models:
