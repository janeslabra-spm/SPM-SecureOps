services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-security_monitoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI backend with YOLO detection
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/security_monitoring}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MODEL_PATH: ${MODEL_PATH:-yolo11n.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.45}
      DEVICE: ${DEVICE:-auto}
      SOURCE_MODE: ${SOURCE_MODE:-webcam}
      CAMERA_INDEX: ${CAMERA_INDEX:-0}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      DEMO_VIDEO_PATH: ${DEMO_VIDEO_PATH:-}
      # AWS Bedrock (AI Compliance Assistant)
      AWS_BEDROCK_ENABLED: ${AWS_BEDROCK_ENABLED:-false}
      AWS_BEDROCK_REGION: ${AWS_BEDROCK_REGION:-us-east-1}
      AWS_BEDROCK_MODEL_ID: ${AWS_BEDROCK_MODEL_ID:-us.amazon.nova-lite-v1:0}
      AWS_BEDROCK_MAX_TOKENS: ${AWS_BEDROCK_MAX_TOKENS:-300}
      AWS_BEDROCK_TEMPERATURE: ${AWS_BEDROCK_TEMPERATURE:-0.3}
      AWS_BEDROCK_CACHE_TTL: ${AWS_BEDROCK_CACHE_TTL:-120}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - screenshots:/app/screenshots
      - yolo_models:/root/.cache
    ports:
      - "8000:8000"
    # Uncomment below to pass through a USB webcam
    # devices:
    #   - /dev/video0:/dev/video0

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Runtime variable used by Next.js rewrites to proxy API calls to backend
      BACKEND_URL: http://backend:8000
      # NOT used at runtime (baked at build), but kept for documentation
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  screenshots:
  yolo_models:
